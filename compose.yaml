services:
  rigbook:
    build: .
    image: rigbook:latest
    container_name: rigbook
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8290:8000"
    volumes:
      - ./data:/data
    # Values come from .env next to this file (see .env.example); both are optional
    environment:
      - RIGBOOK_PASSWORD=${RIGBOOK_PASSWORD:-}
      - RIGBOOK_URL=${RIGBOOK_URL:-}
